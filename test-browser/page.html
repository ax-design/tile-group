<!doctype html>
<html><head><meta charset="utf-8"><title>tile group browser test</title>
<style>
  body { margin: 0; padding: 20px; }
  ax-tile-group { --tile-cell-width: 40px; --tile-cell-height: 40px; --tile-gap: 4px; --tile-rows: 4; margin-bottom: 30px; }
  ax-tile-group.roomy { --tile-cell-width: 48px; --tile-cell-height: 64px; }
  ax-tile { --ax-fill-color: #889; }
  /* The entrance of a group is a page's choice: none by default. */
  #en, #ev { --tile-entrance: desktop; }
  #ev.mobile-in { --tile-entrance: mobile; }
  #en.to-mobile { --tile-entrance: mobile; }
  #en.unrelated { --tile-rows: 4; }
</style></head>
<body>
<ax-tile-group id="g" drag="press" contextmenu>
  <ax-tile id="a" columns="2" rows="2" layers="fill">A</ax-tile>
  <ax-tile id="b" columns="2" rows="2" layers="fill">B</ax-tile>
  <ax-tile id="c" columns="2" rows="2" layers="fill">C</ax-tile>
  <ax-tile id="d" columns="2" rows="2" layers="fill">D</ax-tile>
  <ax-tile id="e" columns="4" rows="2" layers="fill">E</ax-tile>
  <div id="f" columns="1" rows="1" style="background: #99a">F</div>
</ax-tile-group>
<ax-tile-group id="h" drag="hold" hold-delay="200">
  <ax-tile id="h1" columns="2" rows="2" layers="fill">1</ax-tile>
  <ax-tile id="h2" columns="2" rows="2" layers="fill">2</ax-tile>
  <ax-tile id="h3" columns="2" rows="2" layers="fill">3</ax-tile>
</ax-tile-group>
<ax-tile-group id="x" drag="cross-slide">
  <ax-tile id="x1" columns="2" rows="2" layers="fill">1</ax-tile>
  <ax-tile id="x2" columns="2" rows="2" layers="fill">2</ax-tile>
  <ax-tile id="x3" columns="2" rows="2" layers="fill">3</ax-tile>
</ax-tile-group>
<ax-tile-group id="v" orientation="vertical" drag="press" style="--tile-columns: 6">
  <ax-tile id="v1" columns="2" rows="2" layers="fill">1</ax-tile>
  <ax-tile id="v2" columns="2" rows="2" layers="fill">2</ax-tile>
  <ax-tile id="v3" columns="2" rows="2" layers="fill">3</ax-tile>
  <ax-tile id="v4" columns="2" rows="2" layers="fill">4</ax-tile>
</ax-tile-group>
<div style="width: 180px"><ax-tile-group id="va" orientation="vertical" style="--tile-columns: auto">
  <ax-tile columns="2" rows="2" layers="fill"></ax-tile>
  <ax-tile columns="2" rows="2" layers="fill"></ax-tile>
  <ax-tile columns="2" rows="2" layers="fill"></ax-tile>
</ax-tile-group></div>
<ax-tile-group id="ha" style="--tile-rows: auto; height: 90px">
  <ax-tile columns="2" rows="2" layers="fill"></ax-tile>
  <ax-tile columns="2" rows="2" layers="fill"></ax-tile>
</ax-tile-group>
<!-- Keyboard: links in the tiles keep the focus, the field does not move its arrows. -->
<ax-tile-group id="k" drag="press">
  <ax-tile id="k1" columns="2" rows="2" layers="fill"><a id="k1a" href="#k1">One</a></ax-tile>
  <ax-tile id="k2" columns="2" rows="2" layers="fill"><a id="k2a" href="#k2">Two</a></ax-tile>
  <ax-tile id="k3" columns="2" rows="2" layers="fill"><input id="k3i" aria-label="Field"></ax-tile>
  <ax-tile id="k4" columns="2" rows="2" layers="fill"><a id="k4a" href="#k4">Four</a></ax-tile>
</ax-tile-group>
<ax-tile-group id="n">
  <ax-tile id="n1" columns="2" rows="2" layers="fill"><a id="n1a" href="#n1">N1</a></ax-tile>
  <ax-tile id="n2" columns="2" rows="2" layers="fill"><a id="n2a" href="#n2">N2</a></ax-tile>
</ax-tile-group>
<ax-tile-group id="r" drag="press" style="direction: rtl">
  <ax-tile id="r1" columns="2" rows="2" layers="fill"><a id="r1a" href="#r1">R1</a></ax-tile>
  <ax-tile id="r2" columns="2" rows="2" layers="fill"><a id="r2a" href="#r2">R2</a></ax-tile>
  <ax-tile id="r3" columns="2" rows="2" layers="fill"><a id="r3a" href="#r3">R3</a></ax-tile>
  <ax-tile id="r4" columns="2" rows="2" layers="fill"><a id="r4a" href="#r4">R4</a></ax-tile>
</ax-tile-group>
<ax-tile-group id="m">
  <ax-tile id="m1" columns="2" rows="2" layers="fill"><a id="m1a" href="#m1">M1</a></ax-tile>
  <ax-tile id="m2" columns="2" rows="2" layers="fill"><a id="m2a" href="#m2">M2</a></ax-tile>
  <ax-tile id="m3" columns="2" rows="2" layers="fill"><a id="m3a" href="#m3">M3</a></ax-tile>
</ax-tile-group>
<ax-tile-group id="p" drag="press">
  <ax-tile id="p1" columns="2" rows="2" layers="fill"><a id="p1a" href="#p1">P1</a></ax-tile>
  <ax-tile id="p2" columns="2" rows="2" layers="fill"><a id="p2a" href="#p2">P2</a></ax-tile>
  <ax-tile id="p3" columns="2" rows="2" layers="fill"><a id="p3a" href="#p3">P3</a></ax-tile>
  <ax-tile id="p4" columns="2" rows="2" layers="fill"><a id="p4a" href="#p4">P4</a></ax-tile>
</ax-tile-group>
<ax-tile-group id="q" drag="press">
  <ax-tile id="q1" columns="2" rows="2" layers="fill"><a id="q1a" href="#q1">Q1</a></ax-tile>
  <ax-tile id="q2" columns="2" rows="2" layers="fill"><a id="q2a" href="#q2">Q2</a></ax-tile>
  <ax-tile id="q3" columns="2" rows="2" layers="fill"><a id="q3a" href="#q3">Q3</a></ax-tile>
  <ax-tile id="q4" columns="2" rows="2" layers="fill"><a id="q4a" href="#q4">Q4</a></ax-tile>
</ax-tile-group>
<ax-tile-group id="o" drag="none" announce="off">
  <ax-tile id="o1" columns="2" rows="2" layers="fill">O1</ax-tile>
  <ax-tile id="o2" columns="2" rows="2" layers="fill">O2</ax-tile>
</ax-tile-group>
<ax-tile-group id="l" drag="none">
  <ax-tile id="l1" columns="2" rows="2" layers="fill" aria-label="Mail">x</ax-tile>
  <ax-tile id="l2" columns="2" rows="2" layers="fill"><span><a aria-label="Calendar" href="#l2">x</a></span></ax-tile>
  <ax-tile id="l3" columns="2" rows="2" layers="fill">Notes</ax-tile>
</ax-tile-group>
<!-- Children that change size: <ax-tile> and a plain <div>, moved by the group (check 2b). -->
<ax-tile-group id="cg">
  <div id="cg1" columns="2" rows="2" style="background: #99a">1</div>
  <ax-tile id="cg2" columns="2" rows="2" layers="fill">2</ax-tile>
  <ax-tile id="cg3" columns="2" rows="2" layers="fill">3</ax-tile>
  <div id="cg4" columns="2" rows="2" style="background: #99a">4</div>
</ax-tile-group>
<!-- Entrance and exit: "ea" has none; "en" (surfaces) and "ep" (plain elements) are below the spacer,
     so "en" plays its entrance when it is scrolled in. -->
<ax-tile-group id="ea">
  <ax-tile id="ea1" columns="2" rows="2" layers="fill">1</ax-tile>
  <ax-tile id="ea2" columns="2" rows="2" layers="fill">2</ax-tile>
</ax-tile-group>
<div style="height: 1200px"></div>
<ax-tile-group id="en" drag="press">
  <ax-tile id="en1" columns="2" rows="2" layers="fill">1</ax-tile>
  <ax-tile id="en2" columns="2" rows="2" layers="fill">2</ax-tile>
  <ax-tile id="en3" columns="4" rows="2" layers="fill">3</ax-tile>
  <ax-tile id="en4" columns="2" rows="2" layers="fill">4</ax-tile>
</ax-tile-group>
<ax-tile-group id="ev">
  <ax-tile id="ev1" columns="2" rows="2" layers="fill">1</ax-tile>
  <ax-tile id="ev2" columns="2" rows="2" layers="fill">2</ax-tile>
</ax-tile-group>
<ax-tile-group id="ep">
  <div id="ep1" columns="2" rows="2" style="background: #99a">1</div>
  <div id="ep2" columns="2" rows="2" style="background: #99a">2</div>
  <div id="ep3" columns="4" rows="2" style="background: #99a">3</div>
  <div id="ep4" columns="2" rows="2" style="background: #99a">4</div>
</ax-tile-group>
<script type="module" src="./page.ts"></script>
</body></html>
